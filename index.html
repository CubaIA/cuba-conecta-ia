<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuba Conecta IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      color: #222;
    }

    header {
      background: #0b4f6c;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 15px;
    }

    .chat-box {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    #chat {
      min-height: 250px;
      max-height: 450px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      background: #d9edf7;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #eeeeee;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    #sendButton {
      padding: 13px 20px;
      border: none;
      border-radius: 10px;
      background: #0b4f6c;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #sendButton:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      min-height: 20px;
      margin: 10px;
      color: #666;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🇨🇺 Cuba Conecta IA</h1>
    <p>Tu asistente inteligente para Cuba</p>
  </header>

  <div class="container">
    <div class="chat-box">

      <div id="chat">
        <div class="message bot">
          👋 Hola. Soy Cuba Conecta IA.<br><br>
          ¿En qué puedo ayudarte?
        </div>
      </div>

      <div id="status"></div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Escribe tu pregunta..."
        >

        <button id="sendButton">
          Enviar
        </button>
      </div>

    </div>
  </div>

  <footer>
    Cuba Conecta IA 🇨🇺
  </footer>

  <script src="script.js"></script>

</body>
</html>
